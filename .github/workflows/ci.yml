# ============================================================
# CI Pipeline — Stale Profile Remediation
# University of Huddersfield | Jayden Hindley
#
# Triggers on every push and pull request to any branch.
# Two automated gates must pass before code is considered
# ready for deployment to Intune:
#   1. PSScriptAnalyzer — code quality and best practice
#   2. Pester           — unit tests with mocked CIM responses
# ============================================================

name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  lint-and-test:
    name: PSScriptAnalyzer and Pester
    runs-on: windows-latest

    steps:

      # -------------------------------------------------------
      # Step 1 — Check out repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # Step 2 — PSScriptAnalyzer
      # -------------------------------------------------------
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Write-Host "Installing PSScriptAnalyzer..."
          Install-Module PSScriptAnalyzer `
            -Force `
            -SkipPublisherCheck `
            -Scope CurrentUser

          $scripts = Get-ChildItem `
            -Path ./scripts `
            -Recurse `
            -Filter *.ps1 `
            -ErrorAction SilentlyContinue

          if (-not $scripts) {
            Write-Host "No scripts found in /scripts - skipping PSScriptAnalyzer." -ForegroundColor Yellow
            exit 0
          }

          Write-Host "Analysing $($scripts.Count) script(s)..."

          $results = Invoke-ScriptAnalyzer `
            -Path ./scripts `
            -Recurse `
            -Severity @('Warning', 'Error') `
            -ExcludeRule PSAvoidUsingWriteHost

          if ($results) {
            Write-Host ""
            Write-Host "PSScriptAnalyzer found the following issues:" -ForegroundColor Red

            $results | Format-Table -AutoSize

            Write-Host ""
            Write-Host "Build failed. Resolve the issues above before merging." -ForegroundColor Red

            exit 1
          }

          Write-Host "PSScriptAnalyzer passed. No issues found." -ForegroundColor Green


      # -------------------------------------------------------
      # Step 3 — Pester
      # -------------------------------------------------------
      - name: Run Pester Tests
        id: pester
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem `
            -Path ./tests `
            -Recurse `
            -Filter *.Tests.ps1 `
            -ErrorAction SilentlyContinue

          if (-not $testFiles) {
            Write-Host "No Pester test files found in /tests - skipping test run." -ForegroundColor Yellow
            exit 0
          }

          Write-Host "Installing Pester..."

          Install-Module Pester `
            -Force `
            -SkipPublisherCheck `
            -Scope CurrentUser

          Write-Host "Found $($testFiles.Count) test file(s). Running tests..."

          New-Item `
            -ItemType Directory `
            -Path ./tests/results `
            -Force | Out-Null

          $config = New-PesterConfiguration

          $config.Run.Path = './tests'
          $config.Run.Exit = $true

          $config.Output.Verbosity = 'Detailed'

          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = './tests/results/TestResults.xml'

          # IMPORTANT:
          # dorny/test-reporter uses java-junit,
          # therefore Pester MUST create JUnit XML.
          $config.TestResult.OutputFormat = 'JUnitXml'

          Invoke-Pester -Configuration $config


      # -------------------------------------------------------
      # Step 4 — Publish Pester Test Results
      # -------------------------------------------------------
      - name: Publish Test Results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && hashFiles('tests/results/TestResults.xml') != '' }}
        with:
          name: Pester Test Results
          path: tests/results/TestResults.xml
          reporter: java-junit
          fail-on-error: true
